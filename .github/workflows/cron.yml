name: cron

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# contents: write lets us push the data branch; pages/id-token for Pages deploy.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Normal run is ~90s. A generous cap keeps a wedged run from sitting on
    # the `cron` concurrency group (cancel-in-progress: false) for the 6-hour
    # default, which would queue every subsequent 30-min run behind it.
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install
        run: pip install -e .

      # Restore accumulated history from the data branch (may not exist yet).
      - name: Restore data branch
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-restore

      - name: Seed data dir
        run: |
          mkdir -p data
          if [ -d data-restore ]; then
            cp -r data-restore/. data/ 2>/dev/null || true
            rm -rf data/.git
          fi

      - name: Run pipeline + build site
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          TELEGRAM_URL: ${{ vars.TELEGRAM_URL }}
          APIFY_URL: ${{ vars.APIFY_URL }}
          ALERT_THRESHOLD_APR: ${{ vars.ALERT_THRESHOLD_APR }}
        run: python -m radar.run --data-dir data --site-out _site

      # Persist history + latest.json back to the data branch (created if absent).
      - name: Publish data branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: data
          folder: data
          commit-message: "data: ${{ github.run_id }}"
          single-commit: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # Pages deploy occasionally returns a transient "try again later". The
      # data pipeline has already succeeded and the site self-heals on the
      # next 30-min run, so a Pages hiccup must not fail the run or fire a
      # false-alarm alert. A persistent failure just leaves the site stale
      # (visible), which is acceptable.
      - name: Deploy Pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

  # Alerting lives in its own job, not a step of `run`. A step-level
  # `if: failure()` only fires once the job is executing, so the whole class
  # of job-level deaths — runner never acquired, queue timeout, timeout-minutes
  # hit, manual cancel — used to fail completely silently. `needs` + always()
  # catches those too, since this job reports on `run`'s final result rather
  # than running inside it. Caveat: during a full Actions outage even this job
  # cannot get a runner; an outage-proof check has to live outside GitHub.
  notify:
    needs: run
    if: ${{ always() && needs.run.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify failure
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          RESULT: ${{ needs.run.result }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ADMIN" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              -d chat_id="${ADMIN}" \
              -d text="Funding Radar cron ${RESULT}: run ${{ github.run_id }} (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >/dev/null || true
          fi
