[project]
name = "funding-radar"
version = "0.1.0"
description = "Perp DEX funding rate aggregator, arbitrage scanner, and alert engine"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["radar", "radar.venues"]

[tool.pytest.ini_options]
testpaths = ["tests"]
